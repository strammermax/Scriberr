name: MemoRecorder Docker image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/memorecorder-image.yml'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'docker-entrypoint.sh'
permissions:
  contents: read
  packages: write
concurrency:
  group: memorecorder-image
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'strammermax/Scriberr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/strammermax/memorecorder:latest
            ghcr.io/strammermax/memorecorder:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
